name: Test audit failure reported when fail-on-findings is false
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RUNNER_TEMP: /tmp/pipelock-test-temp
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          version: '3.7.1'
          directory: does-not-exist-dir
          fail-on-findings: 'false'
          test-vectors: 'false'
      - name: Assert fail-closed outputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          AUDIT_FAILED: ${{ steps.action.outputs.audit-failed }}
          SCORE: ${{ steps.action.outputs.score }}
          FINDINGS: ${{ steps.action.outputs.findings-count }}
          CRITICALS: ${{ steps.action.outputs.critical-count }}
        run: |
          echo "outcome=$OUTCOME audit-failed=$AUDIT_FAILED score=$SCORE findings=$FINDINGS criticals=$CRITICALS"
          if [ "$OUTCOME" != "success" ] && [ "$OUTCOME" != "failure" ]; then echo "FAIL: unexpected outcome"; exit 1; fi
          if [ "$AUDIT_FAILED" != "true" ]; then echo "FAIL: audit-failed should be true"; exit 1; fi
          if [ "$SCORE" != "0" ] || [ "$FINDINGS" != "0" ] || [ "$CRITICALS" != "0" ]; then
            echo "FAIL: expected zeroed outputs"; exit 1
          fi
          echo "PASS"
