name: Test basic push scan
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          directory: '.'
          fail-on-findings: 'false'
          scan-diff: 'false'
          test-vectors: 'false'
        continue-on-error: true

      - name: Assert audit-failed output is set
        env:
          AUDIT_FAILED: ${{ steps.action.outputs.audit-failed }}
          SCORE: ${{ steps.action.outputs.score }}
          FINDINGS: ${{ steps.action.outputs.findings-count }}
          CRITICALS: ${{ steps.action.outputs.critical-count }}
        run: |
          echo "audit-failed: $AUDIT_FAILED"
          echo "score: $SCORE"
          echo "findings-count: $FINDINGS"
          echo "critical-count: $CRITICALS"
          # The action should produce outputs regardless of findings
          # audit-failed should be either 'true' or 'false'
          if [ "$AUDIT_FAILED" != "true" ] && [ "$AUDIT_FAILED" != "false" ]; then
            echo "FAIL: audit-failed output should be 'true' or 'false', got: '$AUDIT_FAILED'"
            exit 1
          fi
          echo "PASS: audit-failed output is set correctly"
