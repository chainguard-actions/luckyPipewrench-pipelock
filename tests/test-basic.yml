name: Test basic audit of clean directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Reports go here instead of runner.temp, so the action's internal
      # upload-artifact step (incompatible with act's artifact server) finds
      # no files and is skipped via if-no-files-found: ignore.
      RUNNER_TEMP: /tmp/pipelock-test-temp
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create clean scan target
        run: |
          mkdir -p "$GITHUB_WORKSPACE/pipelock-scan-clean"
          echo "# Clean project" > "$GITHUB_WORKSPACE/pipelock-scan-clean/README.md"
      - id: action
        uses: .
        continue-on-error: true
        with:
          version: '3.7.1'
          directory: pipelock-scan-clean
          fail-on-findings: 'false'
          test-vectors: 'false'
      - name: Assert outputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SCORE: ${{ steps.action.outputs.score }}
          FINDINGS: ${{ steps.action.outputs.findings-count }}
          CRITICALS: ${{ steps.action.outputs.critical-count }}
          CONFIG_PATH: ${{ steps.action.outputs.config-path }}
          AUDIT_FAILED: ${{ steps.action.outputs.audit-failed }}
        run: |
          echo "outcome=$OUTCOME score=$SCORE findings=$FINDINGS criticals=$CRITICALS config=$CONFIG_PATH audit_failed=$AUDIT_FAILED"
          if [ "$OUTCOME" != "success" ] && [ "$OUTCOME" != "failure" ]; then echo "FAIL: unexpected outcome"; exit 1; fi
          if [ "$AUDIT_FAILED" != "false" ]; then echo "FAIL: audit-failed should be false"; exit 1; fi
          if ! [[ "$SCORE" =~ ^[0-9]+$ ]] || [ "$SCORE" -gt 100 ]; then echo "FAIL: score not 0-100"; exit 1; fi
          if ! [[ "$FINDINGS" =~ ^[0-9]+$ ]]; then echo "FAIL: findings-count not numeric"; exit 1; fi
          if ! [[ "$CRITICALS" =~ ^[0-9]+$ ]]; then echo "FAIL: critical-count not numeric"; exit 1; fi
          if [ "$CRITICALS" -gt "$FINDINGS" ]; then echo "FAIL: criticals > findings"; exit 1; fi
          if [ -z "$CONFIG_PATH" ] || [ ! -f "$CONFIG_PATH" ]; then echo "FAIL: generated config missing"; exit 1; fi
          echo "PASS"
      - name: Assert pipelock on PATH with pinned version
        run: |
          pipelock version
          pipelock version 2>&1 | grep -q '3.7.1' || { echo "FAIL: version mismatch"; exit 1; }
          echo "PASS"
