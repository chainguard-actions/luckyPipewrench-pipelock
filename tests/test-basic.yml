name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          directory: '.'
          scan-diff: 'false'
          test-vectors: 'false'
          fail-on-findings: 'false'

      - name: Assert action ran (download may fail on sentinel env, audit-failed or success both acceptable)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          AUDIT_FAILED: ${{ steps.action.outputs.audit-failed }}
          SCORE: ${{ steps.action.outputs.score }}
          FINDINGS: ${{ steps.action.outputs.findings-count }}
          CRITICALS: ${{ steps.action.outputs.critical-count }}
        run: |
          echo "outcome: $OUTCOME"
          echo "audit-failed: $AUDIT_FAILED"
          echo "score: $SCORE"
          echo "findings-count: $FINDINGS"
          echo "critical-count: $CRITICALS"
          if [ "$OUTCOME" = "success" ]; then
            # If the action succeeded, outputs should be set
            if [ -z "$SCORE" ] && [ -z "$AUDIT_FAILED" ]; then
              echo "FAIL: action succeeded but no outputs were set"
              exit 1
            fi
            echo "PASS: action succeeded with score=$SCORE findings=$FINDINGS criticals=$CRITICALS"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected — pipelock binary not available in sentinel env)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
