name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          directory: '.'
          fail-on-findings: 'false'
          test-vectors: 'false'
          scan-diff: 'false'

      - name: Assert action ran (outputs set, or failed gracefully on missing release)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SCORE: ${{ steps.action.outputs.score }}
          FINDINGS_COUNT: ${{ steps.action.outputs.findings-count }}
          CRITICAL_COUNT: ${{ steps.action.outputs.critical-count }}
          AUDIT_FAILED: ${{ steps.action.outputs.audit-failed }}
        run: |
          echo "outcome: $OUTCOME"
          echo "score: $SCORE"
          echo "findings_count: $FINDINGS_COUNT"
          echo "critical_count: $CRITICAL_COUNT"
          echo "audit_failed: $AUDIT_FAILED"

          if [ "$OUTCOME" = "success" ]; then
            # Binary was available; validate outputs are set
            if [ -z "$SCORE" ]; then
              echo "FAIL: action succeeded but score output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with score=$SCORE"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (pipelock release not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
