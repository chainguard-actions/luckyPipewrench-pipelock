name: Test custom directory scan
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a subdirectory to scan
        run: |
          mkdir -p /tmp/scan-target
          echo "# Test project" > /tmp/scan-target/README.md
          echo "export API_KEY=placeholder" > /tmp/scan-target/config.sh

      - id: action
        uses: .
        continue-on-error: true
        with:
          version: 'latest'
          directory: '/tmp/scan-target'
          fail-on-findings: 'false'
          test-vectors: 'false'
          scan-diff: 'false'

      - name: Assert action ran or failed gracefully with custom directory
        env:
          OUTCOME: ${{ steps.action.outcome }}
          AUDIT_FAILED: ${{ steps.action.outputs.audit-failed }}
          SCORE: ${{ steps.action.outputs.score }}
          FINDINGS: ${{ steps.action.outputs.findings-count }}
          CRITICALS: ${{ steps.action.outputs.critical-count }}
        run: |
          echo "outcome: $OUTCOME"
          echo "audit-failed: $AUDIT_FAILED"
          echo "score: $SCORE"
          echo "findings-count: $FINDINGS"
          echo "critical-count: $CRITICALS"

          if [ "$OUTCOME" = "success" ]; then
            # Validate outputs are set when action succeeds
            if [ -z "$SCORE" ]; then
              echo "FAIL: action succeeded but score output is empty"
              exit 1
            fi
            if [ -z "$FINDINGS" ]; then
              echo "FAIL: action succeeded but findings-count output is empty"
              exit 1
            fi
            echo "PASS: action succeeded scanning custom directory, score=$SCORE findings=$FINDINGS criticals=$CRITICALS"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (pipelock release not resolvable in this environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
