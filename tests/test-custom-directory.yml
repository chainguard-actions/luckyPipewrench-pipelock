name: Test custom directory scan
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install jq (required by action)
        run: |
          if ! command -v jq &>/dev/null; then
            apt-get install -y jq 2>/dev/null || true
          fi

      - name: Create a subdirectory to scan
        run: |
          mkdir -p "$GITHUB_WORKSPACE/scan-target"
          echo "# Test file for scanning" > "$GITHUB_WORKSPACE/scan-target/README.md"
          echo "This is a test directory for pipelock scanning." >> "$GITHUB_WORKSPACE/scan-target/README.md"

      - id: action
        uses: .
        continue-on-error: true
        with:
          version: 'latest'
          directory: './scan-target'
          fail-on-findings: 'false'
          test-vectors: 'false'
          scan-diff: 'false'

      - name: Assert action ran with custom directory
        env:
          OUTCOME: ${{ steps.action.outcome }}
          AUDIT_FAILED: ${{ steps.action.outputs.audit-failed }}
          SCORE: ${{ steps.action.outputs.score }}
          FINDINGS: ${{ steps.action.outputs.findings-count }}
        run: |
          echo "outcome: $OUTCOME"
          echo "audit-failed: $AUDIT_FAILED"
          echo "score: $SCORE"
          echo "findings-count: $FINDINGS"

          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded scanning custom directory"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (binary download likely failed for non-existent repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
