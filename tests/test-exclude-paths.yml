name: Test exclude-paths input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RUNNER_TEMP: /tmp/pipelock-test-temp
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create scan target
        run: |
          mkdir -p "$GITHUB_WORKSPACE/pipelock-scan-clean/vendor"
          echo "# Clean project" > "$GITHUB_WORKSPACE/pipelock-scan-clean/README.md"
          echo "package vendor" > "$GITHUB_WORKSPACE/pipelock-scan-clean/vendor/lib.go"
      - id: action
        uses: .
        continue-on-error: true
        with:
          version: '3.7.1'
          directory: pipelock-scan-clean
          fail-on-findings: 'false'
          test-vectors: 'false'
          exclude-paths: |
            vendor/
              *.generated.go

      - name: Assert audit ran with excludes
        env:
          OUTCOME: ${{ steps.action.outcome }}
          AUDIT_FAILED: ${{ steps.action.outputs.audit-failed }}
          SCORE: ${{ steps.action.outputs.score }}
          FINDINGS: ${{ steps.action.outputs.findings-count }}
        run: |
          echo "outcome=$OUTCOME audit-failed=$AUDIT_FAILED score=$SCORE findings=$FINDINGS"
          if [ "$OUTCOME" != "success" ] && [ "$OUTCOME" != "failure" ]; then echo "FAIL: unexpected outcome"; exit 1; fi
          if [ "$AUDIT_FAILED" != "false" ]; then echo "FAIL: audit-failed should be false"; exit 1; fi
          if ! [[ "$SCORE" =~ ^[0-9]+$ ]]; then echo "FAIL: score not numeric"; exit 1; fi
          if ! [[ "$FINDINGS" =~ ^[0-9]+$ ]]; then echo "FAIL: findings not numeric"; exit 1; fi
          echo "PASS"
