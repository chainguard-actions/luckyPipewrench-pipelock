name: Test fail-on-findings enabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          directory: '.'
          fail-on-findings: 'true'
          test-vectors: 'false'
          scan-diff: 'false'

      - name: Assert action ran with fail-on-findings enabled (or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SCORE: ${{ steps.action.outputs.score }}
          CRITICAL_COUNT: ${{ steps.action.outputs.critical-count }}
          AUDIT_FAILED: ${{ steps.action.outputs.audit-failed }}
        run: |
          echo "outcome: $OUTCOME"
          echo "score: $SCORE"
          echo "critical_count: $CRITICAL_COUNT"
          echo "audit_failed: $AUDIT_FAILED"

          if [ "$OUTCOME" = "success" ]; then
            # If action succeeded, it means no critical findings were detected
            if [ -z "$SCORE" ]; then
              echo "FAIL: action succeeded but score output is empty"
              exit 1
            fi
            CRIT="${CRITICAL_COUNT:-0}"
            if [ "$CRIT" -gt 0 ]; then
              echo "FAIL: action succeeded but critical_count=$CRIT (should have failed)"
              exit 1
            fi
            echo "PASS: action succeeded with no critical findings (score=$SCORE)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed (either pipelock not resolvable or critical findings detected)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
