name: Test fail-on-findings enabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          version: 'latest'
          directory: '.'
          fail-on-findings: 'true'
          test-vectors: 'false'
          scan-diff: 'false'

      - name: Assert action ran or failed gracefully with fail-on-findings
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SCORE: ${{ steps.action.outputs.score }}
          CRITICAL_COUNT: ${{ steps.action.outputs.critical-count }}
          AUDIT_FAILED: ${{ steps.action.outputs.audit-failed }}
        run: |
          echo "outcome: $OUTCOME"
          echo "score: $SCORE"
          echo "critical-count: $CRITICAL_COUNT"
          echo "audit-failed: $AUDIT_FAILED"
          if [ "$OUTCOME" = "success" ]; then
            # If the binary ran and found no criticals, score should be set
            if [ -z "$SCORE" ]; then
              echo "FAIL: action succeeded but score output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with fail-on-findings=true, score=$SCORE critical-count=$CRITICAL_COUNT"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (pipelock binary not available or criticals found)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
