name: Test fail-on-findings enabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install jq (required by action)
        run: sudo apt-get install -y jq 2>/dev/null || true

      - id: action
        uses: .
        continue-on-error: true
        with:
          version: 'latest'
          directory: '.'
          scan-diff: 'false'
          fail-on-findings: 'true'
          test-vectors: 'false'

      - name: Assert action ran or failed gracefully with fail-on-findings enabled
        env:
          OUTCOME: ${{ steps.action.outcome }}
          AUDIT_FAILED: ${{ steps.action.outputs.audit-failed }}
          SCORE: ${{ steps.action.outputs.score }}
          CRITICALS: ${{ steps.action.outputs.critical-count }}
        run: |
          echo "outcome: $OUTCOME"
          echo "audit-failed: $AUDIT_FAILED"
          echo "score: $SCORE"
          echo "critical-count: $CRITICALS"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with fail-on-findings=true (no critical findings)"
            if [ -z "$SCORE" ]; then
              echo "FAIL: action succeeded but score output is empty"
              exit 1
            fi
            echo "PASS: score=$SCORE critical-count=${CRITICALS:-0}"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed (either binary unavailable, repo not resolvable, or critical findings detected)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
