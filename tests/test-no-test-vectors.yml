name: Test with test-vectors disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install jq (required by action)
        run: |
          if ! command -v jq &>/dev/null; then
            apt-get install -y jq 2>/dev/null || true
          fi

      - id: action
        uses: .
        continue-on-error: true
        with:
          version: 'latest'
          directory: '.'
          fail-on-findings: 'false'
          test-vectors: 'false'
          scan-diff: 'false'

      - name: Assert action ran without test vectors
        env:
          OUTCOME: ${{ steps.action.outcome }}
          AUDIT_FAILED: ${{ steps.action.outputs.audit-failed }}
          SCORE: ${{ steps.action.outputs.score }}
          FINDINGS: ${{ steps.action.outputs.findings-count }}
          CRITICAL: ${{ steps.action.outputs.critical-count }}
        run: |
          echo "outcome: $OUTCOME"
          echo "audit-failed: $AUDIT_FAILED"
          echo "score: $SCORE"
          echo "findings-count: $FINDINGS"
          echo "critical-count: $CRITICAL"

          if [ "$OUTCOME" = "success" ]; then
            # Verify outputs are numeric when set
            if [ -n "$SCORE" ] && ! echo "$SCORE" | grep -qE '^[0-9]+$'; then
              echo "FAIL: score output '$SCORE' is not a valid integer"
              exit 1
            fi
            if [ -n "$FINDINGS" ] && ! echo "$FINDINGS" | grep -qE '^[0-9]+$'; then
              echo "FAIL: findings-count output '$FINDINGS' is not a valid integer"
              exit 1
            fi
            if [ -n "$CRITICAL" ] && ! echo "$CRITICAL" | grep -qE '^[0-9]+$'; then
              echo "FAIL: critical-count output '$CRITICAL' is not a valid integer"
              exit 1
            fi
            echo "PASS: action succeeded with test-vectors=false, all numeric outputs valid"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (binary download likely failed for non-existent repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
