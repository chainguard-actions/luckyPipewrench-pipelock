name: Test scan-diff disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          version: 'latest'
          directory: '.'
          fail-on-findings: 'false'
          test-vectors: 'false'
          scan-diff: 'false'

      - name: Assert scan-diff step was skipped and action ran or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          AUDIT_FAILED: ${{ steps.action.outputs.audit-failed }}
          SCORE: ${{ steps.action.outputs.score }}
          FINDINGS: ${{ steps.action.outputs.findings-count }}
        run: |
          echo "outcome: $OUTCOME"
          echo "audit-failed: $AUDIT_FAILED"
          echo "score: $SCORE"
          echo "findings-count: $FINDINGS"

          # The scan-diff step only runs on pull_request events.
          # Under workflow_dispatch (act harness), it is always skipped.
          # The action should either succeed (binary available) or fail
          # gracefully at the download step (fictional/unavailable repo).
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$SCORE" ]; then
              echo "FAIL: action succeeded but score output is empty"
              exit 1
            fi
            if [ -z "$FINDINGS" ]; then
              echo "FAIL: action succeeded but findings-count output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with scan-diff=false, score=$SCORE findings=$FINDINGS"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (pipelock release not resolvable in this environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
