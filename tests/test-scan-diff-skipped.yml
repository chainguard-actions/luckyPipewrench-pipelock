name: Test scan-diff skipped on non-PR event
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install jq (required by action)
        run: |
          if ! command -v jq &>/dev/null; then
            apt-get install -y jq 2>/dev/null || true
          fi

      - id: action
        uses: .
        continue-on-error: true
        with:
          version: 'latest'
          directory: '.'
          scan-diff: 'true'
          fail-on-findings: 'false'
          test-vectors: 'false'

      - name: Assert scan-diff step was skipped (not a pull_request event)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          AUDIT_FAILED: ${{ steps.action.outputs.audit-failed }}
          SCORE: ${{ steps.action.outputs.score }}
        run: |
          echo "outcome: $OUTCOME"
          echo "audit-failed: $AUDIT_FAILED"
          echo "score: $SCORE"
          # Under workflow_dispatch (act), the scan-diff step is skipped because
          # github.event_name != 'pull_request'. The action should still complete.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded; scan-diff step was skipped (not a PR event)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (binary download likely failed for non-existent repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
