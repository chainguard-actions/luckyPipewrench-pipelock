name: Test specific version input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          version: '1.0.0'
          directory: '.'
          scan-diff: 'false'
          test-vectors: 'false'
          fail-on-findings: 'false'

      - name: Assert action ran with specific version
        env:
          OUTCOME: ${{ steps.action.outcome }}
          AUDIT_FAILED: ${{ steps.action.outputs.audit-failed }}
          SCORE: ${{ steps.action.outputs.score }}
          CONFIG_PATH: ${{ steps.action.outputs.config-path }}
        run: |
          echo "outcome: $OUTCOME"
          echo "audit-failed: $AUDIT_FAILED"
          echo "score: $SCORE"
          echo "config-path: $CONFIG_PATH"
          if [ "$OUTCOME" = "success" ]; then
            # If succeeded, outputs should be populated
            if [ -z "$SCORE" ] && [ -z "$AUDIT_FAILED" ]; then
              echo "FAIL: action succeeded but no outputs were set"
              exit 1
            fi
            echo "PASS: action succeeded with specific version, score=$SCORE"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected — pipelock v1.0.0 not available in sentinel env)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
