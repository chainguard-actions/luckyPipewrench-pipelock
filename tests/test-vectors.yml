name: Test with built-in test vectors enabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RUNNER_TEMP: /tmp/pipelock-test-temp
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create clean scan target
        run: |
          mkdir -p "$GITHUB_WORKSPACE/pipelock-scan-clean"
          echo "# Clean project" > "$GITHUB_WORKSPACE/pipelock-scan-clean/README.md"
      # fail-on-findings=false so the only step that can fail the action is the
      # "Test scanning coverage" step (test vectors with --fail-on-gap).
      - id: action
        uses: .
        continue-on-error: true
        with:
          version: '3.7.1'
          directory: pipelock-scan-clean
          fail-on-findings: 'false'
          test-vectors: 'true'
      - name: Assert test vectors ran and outcome matches
        env:
          OUTCOME: ${{ steps.action.outcome }}
          AUDIT_FAILED: ${{ steps.action.outputs.audit-failed }}
          CRITICALS: ${{ steps.action.outputs.critical-count }}
          FINDINGS: ${{ steps.action.outputs.findings-count }}
          CONFIG_PATH: ${{ steps.action.outputs.config-path }}
        run: |
          echo "outcome=$OUTCOME audit-failed=$AUDIT_FAILED findings=$FINDINGS criticals=$CRITICALS config=$CONFIG_PATH"
          if [ "$OUTCOME" != "success" ] && [ "$OUTCOME" != "failure" ]; then echo "FAIL: unexpected outcome"; exit 1; fi
          if [ "$AUDIT_FAILED" != "false" ]; then echo "FAIL: audit-failed should be false"; exit 1; fi
          if ! [[ "$CRITICALS" =~ ^[0-9]+$ ]]; then echo "FAIL: critical-count not numeric"; exit 1; fi
          if ! [[ "$FINDINGS" =~ ^[0-9]+$ ]]; then echo "FAIL: findings-count not numeric"; exit 1; fi
          if [ -z "$CONFIG_PATH" ] || [ ! -f "$CONFIG_PATH" ]; then echo "FAIL: config-path missing"; exit 1; fi
          # Independently run the same test vectors the action runs.
          RC=0
          pipelock test --config "$CONFIG_PATH" --fail-on-gap > /tmp/vectors.log 2>&1 || RC=$?
          tail -n 15 /tmp/vectors.log
          if ! grep -q "Results:" /tmp/vectors.log; then echo "FAIL: test vectors produced no results summary"; exit 1; fi
          if [ "$RC" -eq 0 ]; then
            if [ "$OUTCOME" != "success" ]; then echo "FAIL: vectors pass but action failed"; exit 1; fi
          else
            if [ "$OUTCOME" != "failure" ]; then echo "FAIL: vectors fail (rc=$RC) but action succeeded"; exit 1; fi
          fi
          echo "PASS: action outcome ($OUTCOME) is consistent with test vector result (rc=$RC)"
