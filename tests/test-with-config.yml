name: Test with user-provided config
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal pipelock config file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/pipelock.yaml" <<'EOF'
          version: 1
          rules: []
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          config: 'tests/fixtures/pipelock.yaml'
          directory: '.'
          scan-diff: 'false'
          test-vectors: 'false'
          fail-on-findings: 'false'

      - name: Assert action ran with user-provided config
        env:
          OUTCOME: ${{ steps.action.outcome }}
          AUDIT_FAILED: ${{ steps.action.outputs.audit-failed }}
          CONFIG_PATH: ${{ steps.action.outputs.config-path }}
        run: |
          echo "outcome: $OUTCOME"
          echo "audit-failed: $AUDIT_FAILED"
          echo "config-path: $CONFIG_PATH"
          if [ "$OUTCOME" = "success" ]; then
            # When config is provided, config-path output should match the input
            if [ -n "$CONFIG_PATH" ] && [ "$CONFIG_PATH" != "tests/fixtures/pipelock.yaml" ]; then
              echo "WARN: config-path '$CONFIG_PATH' differs from input (may be absolute path)"
            fi
            echo "PASS: action succeeded with user-provided config"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected — pipelock binary not available in sentinel env)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
