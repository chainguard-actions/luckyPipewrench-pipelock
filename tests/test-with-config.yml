name: Test with config file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install jq (required by action)
        run: |
          if ! command -v jq &>/dev/null; then
            apt-get install -y jq 2>/dev/null || true
          fi

      - name: Create a minimal pipelock config file
        run: |
          mkdir -p "$RUNNER_TEMP/pipelock-config"
          cat > "$RUNNER_TEMP/pipelock-config/pipelock.yaml" <<'EOF'
          version: 1
          rules:
            - id: test-rule
              description: "Test rule for CI"
              severity: warning
              pattern: "PLACEHOLDER_SECRET"
          EOF
          echo "Config file created at $RUNNER_TEMP/pipelock-config/pipelock.yaml"

      - id: action
        uses: .
        continue-on-error: true
        with:
          version: 'latest'
          config: '${{ runner.temp }}/pipelock-config/pipelock.yaml'
          directory: '.'
          fail-on-findings: 'false'
          test-vectors: 'false'
          scan-diff: 'false'

      - name: Assert action ran with config
        env:
          OUTCOME: ${{ steps.action.outcome }}
          AUDIT_FAILED: ${{ steps.action.outputs.audit-failed }}
          CONFIG_PATH: ${{ steps.action.outputs.config-path }}
          SCORE: ${{ steps.action.outputs.score }}
        run: |
          echo "outcome: $OUTCOME"
          echo "audit-failed: $AUDIT_FAILED"
          echo "config-path: $CONFIG_PATH"
          echo "score: $SCORE"

          if [ "$OUTCOME" = "success" ]; then
            # When config is provided, config-path output should match the provided config
            if [ -n "$CONFIG_PATH" ]; then
              echo "PASS: action succeeded with config-path='$CONFIG_PATH'"
            else
              echo "PASS: action succeeded (config-path may be empty if audit failed)"
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (binary download likely failed for non-existent repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
